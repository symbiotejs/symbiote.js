name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - run: npm install

      - name: Install test browsers
        run: npm run test:setup

      - name: Complete test suite
        env:
          # The Ubuntu runner blocks Chrome for Testing's user-namespace sandbox.
          # Puppeteer only opens repository fixtures in this disposable test job.
          PUPPETEER_DANGEROUS_NO_SANDBOX: 'true'
        run: npm test
