<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <script type="module" src="./index.js"></script>
</head>
<body>
  <sym-context ctx="APP" storage-key="symbiote-routed-todo" storage-keys="tasks,sort">
    <script type="application/json">
      {
        "tasks": [],
        "draft": {
          "title": "",
          "done": false
        },
        "filter": {},
        "allFilter": {},
        "activeFilter": {
          "done": false
        },
        "completedFilter": {
          "done": true
        },
        "completePatch": {
          "done": true
        },
        "query": "",
        "sort": {
          "field": "title",
          "direction": "asc"
        },
        "visibleCount": 0,
        "totalCount": 0
      }
    </script>
    <sym-router ctx="ROUTER" use-template="#router-shell"></sym-router>

    <p bind="hidden: !+storageDirty">Local changes have not been saved in this browser.</p>
    <button type="button" bind="onclick: [persist]APP">Save in this browser</button>
    <button type="button" bind="onclick: [restore]APP">Restore browser data</button>
    <p role="alert" bind="hidden: !+storageError; textContent: +storageErrorMessage"></p>
    <sym-conditional when="APP/+storageConflict">
      <p>Another tab changed the saved data. Your current draft is still here.</p>
      <button type="button" bind="onclick: [restore]APP">Use saved data</button>
      <button type="button" action-overwrite bind="onclick: [persist]APP">Keep this draft</button>
    </sym-conditional>
  </sym-context>

  <template id="router-shell">
    <script type="application/json">
      {
        "routes": {
          "tasks": {
            "title": "Tasks",
            "default": true
          },
          "settings": {
            "title": "Settings"
          },
          "notFound": {
            "title": "Page not found",
            "error": true
          }
        }
      }
    </script>
    <header>
      <h1>{{title}}</h1>
      <nav aria-label="Pages">
        <a href="?tasks" bind="onclick: [navigate]ROUTER">Tasks</a>
        <a href="?settings" bind="onclick: [navigate]ROUTER">Settings</a>
      </nav>
    </header>
    <sym-conditional when="ROUTER/route" is="tasks" behavior="dom-add" use-template="#tasks-page"></sym-conditional>
    <sym-conditional when="ROUTER/route" is="settings" behavior="dom-add" use-template="#settings-page"></sym-conditional>
    <sym-conditional when="ROUTER/route" is="notFound">
      <p>The requested page does not exist.</p>
      <button type="button" value="tasks" bind="onclick: [navigate]ROUTER">Return to tasks</button>
    </sym-conditional>
  </template>

  <template id="tasks-page">
    <sym-import src="./fragments/todo.html"></sym-import>
  </template>

  <template id="settings-page">
    <sym-context bind="$: APP/sort" pub-to="APP/sort">
      <label>Task order
        <select bind="value: direction; onchange: [pub-to]direction">
          <option value="asc">Title, ascending</option>
          <option value="desc">Title, descending</option>
        </select>
      </label>
    </sym-context>
  </template>
</body>
</html>
